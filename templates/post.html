<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} · Gagik Navasardyan</title>
  <meta name="description" content="{{summary}}">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="canonical" href="{{url}}">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{summary}}">
  <meta property="og:image" content="{{site}}/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Gagik Navasardyan · MSc in Artificial Intelligence, UB · UPC · URV, Barcelona.">
  <meta property="og:url" content="{{url}}">
  <meta property="article:published_time" content="{{date_iso}}">
  <meta property="article:author" content="{{author}}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="{{root}}assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <script src="{{root}}theme.js"></script>
  <script src="{{root}}transitions.js"></script>
  <link rel="stylesheet" href="{{root}}styles.css">
  <link rel="stylesheet" href="{{root}}blog.css">
  <script src="{{root}}blog.js" defer></script>
{{math}}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{title}}",
    "datePublished": "{{date_iso}}",
    "author": { "@type": "Person", "name": "{{author}}" },
    "url": "{{url}}"
  }
  </script>
</head>
<body class="blog">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="reading-progress" aria-hidden="true"></div>
    <nav class="nav container" aria-label="Main">
      <a class="nav-logo" href="{{root}}index.html" aria-label="Back to the portfolio">GN</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a class="nav-writing active" href="{{root}}writing/"><span class="nav-writing-dot" aria-hidden="true"></span>Blog</a></li>
      </ul>
      <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme" title="Toggle theme">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          </button>
      </div>
    </nav>
  </header>

  <main id="main" class="blog-main">
    <div class="container">

      <div class="window window-post">
        <div class="window-bar" aria-hidden="true">
          <span class="term-dot term-dot-r"></span>
          <span class="term-dot term-dot-y"></span>
          <span class="term-dot term-dot-g"></span>
          <span class="window-title">{{title}}</span>
        </div>
        <div class="window-body">
          {{live_badge}}
          <a class="back-link" href="{{root}}writing/">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            blog
          </a>

          {{draft_banner}}

          <article class="post">
            <header class="post-header">
              <h1>{{title}}</h1>
              <p class="post-byline">
                <time datetime="{{shown_iso}}">{{date_display}}</time>
                {{updated}}
                {{reading_time}}
                {{tags}}
              </p>
            </header>

            <div class="prose">
{{content}}
            </div>
          </article>

          <footer class="post-footer">
            <p>
              Written by {{author}}.
              <a href="mailto:gagiknavasard@gmail.com">Send a reply</a>.
            </p>
            <a class="back-link" href="{{root}}writing/">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
              all posts
            </a>
          </footer>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Gagik Navasardyan</p>
    </div>
  </footer>
</body>
</html>
